[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/claude"
  function = "claude"

[[edge_functions]]
  path = "/api/slack"
  function = "slack"

[[edge_functions]]
  path = "/api/slack-sync"
  function = "slack-sync"

[[edge_functions]]
  path = "/api/slack-upload"
  function = "slack-upload"

[[edge_functions]]
  path = "/api/slack-users"
  function = "slack-users"

[[edge_functions]]
  path = "/api/slack-note-notify"
  function = "slack-note-notify"

