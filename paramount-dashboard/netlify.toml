[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/claude"
  function = "claude"

[[edge_functions]]
  path = "/api/lock-wip"
  function = "lock-wip"

[[edge_functions]]
  path = "/api/slack"
  function = "slack"

[[edge_functions]]
  path = "/api/slack-sync"
  function = "slack-sync"

[[edge_functions]]
  path = "/api/slack-upload"
  function = "slack-upload"

[[edge_functions]]
  path = "/api/slack-users"
  function = "slack-users"

[[edge_functions]]
  path = "/api/slack-note-notify"
  function = "slack-note-notify"

# Scheduled WIP lockdown - every Saturday at midnight ET (05:00 UTC)
[[scheduled_functions]]
  function = "lock-wip"
  cron = "0 5 * * 6"

# Automated LIFT WIP feed - top of every hour. Pulls orders+products from the
# LIFT ORDS API, writes a fresh sched_snapshots + sched_wip_rows. Manual
# "Upload LIFT WIP" stays available as a fallback (newest snapshot wins).
[[scheduled_functions]]
  function = "lift-wip-sync"
  cron = "0 * * * *"
