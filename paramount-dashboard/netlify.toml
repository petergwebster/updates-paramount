[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/claude"
  function = "claude"

[[edge_functions]]
  path = "/api/slack"
  function = "slack"

[[edge_functions]]
  path = "/api/slack-sync"
  function = "slack-sync"

[[edge_functions]]
  path = "/api/slack-upload"
  function = "slack-upload"

[[edge_functions]]
  path = "/api/slack-users"
  function = "slack-users"

[[edge_functions]]
  path = "/api/slack-note-notify"
  function = "slack-note-notify"

# lock-wip REMOVED 2026-07-07: dead Monday-era code — it wrote to the
# wip_snapshots table, which no longer exists. Its Saturday schedule and its
# /api/lock-wip edge mapping are gone; the .js files remain on disk for
# reference only. (The WIP tab's manual "Upload LIFT WIP" is separate plumbing
# and unaffected.)

# Automated LIFT WIP feed - top of every hour. Pulls orders+products from the
# LIFT ORDS API, writes a fresh sched_snapshots + sched_wip_rows. Manual
# "Upload LIFT WIP" stays available as a fallback (newest snapshot wins).
[functions."lift-wip-sync"]
  schedule = "0 * * * *"
